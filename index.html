<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Pribadi</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e0e7ff;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        .container {
            background-color: white;
            width: 70%;
            max-width: 500px;
            margin: 80px auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px gray;
        }

        h1 {
            color: #4f46e5;
        }

        h3 {
            color: #ec4899;
        }

        p {
            color: #444;
            line-height: 1.6;
        }

        button {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: #3730a3;
        }

        #pesan {
            color: #4f46e5;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Halo, Saya Afiva!</h1>

        <h3>Mahasiswa</h3>

        <p>
            Selamat datang di website profil pribadi saya.
            Saya sedang belajar membuat website menggunakan HTML.
        </p>

        <hr>

        <h3>Profil Saya</h3>

        <p>Nama: Afiva</p>
        <p>Hobi: Turu Sampai Lupa Waktu</p>
        <p>Cita-cita: CEO Muda</p>

        <button onclick="tampilkanPesan()">
            Klik Saya
        </button>

        <p id="pesan"></p>

    </div>

    <script>
        function tampilkanPesan() {
            document.getElementById("pesan").innerHTML =
                "Terima kasih sudah mengunjungi website saya! 😊";
        }
    </script>

</body>
</html>
